<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:#0c0f18;color:#e2e8f0;min-height:100vh}
  /* 상단 헤더 */
  .header{background:#111422;border-bottom:1px solid #1e2433;padding:16px 20px;position:sticky;top:0;z-index:100}
  .header h1{font-size:14px;font-weight:700;color:#94a3b8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search{background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;padding:6px 12px;color:#e2e8f0;font-size:12px;width:200px;font-family:'Noto Sans KR',sans-serif}
  .search:focus{outline:none;border-color:#3b82f6}
  .filter-btn{background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;padding:5px 12px;color:#94a3b8;font-size:11px;cursor:pointer;transition:all .15s}
  .filter-btn:hover,.filter-btn.active{background:#2d3748;color:#e2e8f0;border-color:#475569}
  .filter-btn.active{background:#1e3a5f;border-color:#3b82f6;color:#60a5fa}
  .count-badge{font-size:11px;color:#475569;margin-left:auto}

  /* 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px}

  /* 카드 */
  .card{background:#111422;border:1px solid #1e2433;border-radius:10px;overflow:hidden;transition:border-color .15s}
  .card:hover{border-color:#2d3748}
  .card-header{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .col-name{font-family:'JetBrains Mono',monospace;font-size:11px;color:#c8d6e5;font-weight:500;line-height:1.4}
  .badges{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
  .badge-cat  {background:#1e3a2a;color:#34d399}
  .badge-num  {background:#1e2f4a;color:#60a5fa}
  .badge-drop {background:#3f1f1f;color:#f87171}
  .badge-zero {background:#2f1a0f;color:#f59e0b}

  /* 통계 */
  .stats{display:flex;gap:0;border-top:1px solid #1a1f2e;border-bottom:1px solid #1a1f2e}
  .stat{flex:1;padding:6px 8px;text-align:center;border-right:1px solid #1a1f2e}
  .stat:last-child{border-right:none}
  .stat-label{font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500}
  .stat-value.red{color:#f87171}
  .stat-value.green{color:#34d399}
  .stat-value.blue{color:#60a5fa}
  .stat-value.gray{color:#64748b}

  /* 결측치 바 */
  .missing-row{padding:6px 14px;display:flex;align-items:center;gap:8px}
  .missing-label{font-size:10px;color:#475569;width:36px;flex-shrink:0}
  .missing-track{flex:1;height:5px;background:#1e2433;border-radius:3px;overflow:hidden}
  .missing-fill{height:100%;border-radius:3px;transition:width .3s}
  .missing-pct{font-family:'JetBrains Mono',monospace;font-size:10px;width:42px;text-align:right;flex-shrink:0}

  /* 차트 */
  .chart-area{padding:10px 14px 12px}
  .chart-title{font-size:10px;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
  .bar-chart{display:flex;flex-direction:column;gap:4px}
  .bar-row{display:flex;align-items:center;gap:6px}
  .bar-key{font-size:10px;color:#94a3b8;width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{flex:1;height:14px;background:#1a1f2e;border-radius:3px;overflow:hidden;position:relative}
  .bar-fill-cat{height:100%;border-radius:3px;background:#2563eb;opacity:.85}
  .bar-val{font-family:'JetBrains Mono',monospace;font-size:9px;color:#64748b;width:52px;text-align:right;flex-shrink:0}
  /* 히스토그램 */
  .hist-wrap{display:flex;align-items:flex-end;gap:1px;height:60px}
  .hist-bar{flex:1;background:#2563eb;opacity:.8;border-radius:1px 1px 0 0;min-width:2px;transition:opacity .15s}
  .hist-bar:hover{opacity:1}
  .hist-axis{display:flex;justify-content:space-between;margin-top:3px}
  .hist-axis span{font-size:9px;color:#475569}
</style>
</head>

// drop 태그 자동 추가
const DROP_COLS = ['PGD 시술 여부','PGS 시술 여부','난자 채취 경과일','난자 해동 경과일','배아 해동 경과일',
  '임신 시도 또는 마지막 임신 경과 연수','착상 전 유전 검사 사용 여부'];
DROP_COLS.forEach(c => { if(DATA[c]) DATA[c].drop = true; });

function fmt(n){ return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n); }
function fmtFull(n){ return n.toLocaleString(); }

function missingColor(pct){
  if(pct >= 80) return '#ef4444';
  if(pct >= 20) return '#f59e0b';
  if(pct >= 2)  return '#3b82f6';
  return '#22c55e';
}

function buildCard(name, d){
  const missingPct = (d.missing / d.total * 100);
  const isDrop = !!d.drop;
  const isZero = !!d.zero_var;

  let badges = '';
  if(isDrop) badges += `<span class="badge badge-drop">DROP</span>`;
  if(isZero) badges += `<span class="badge badge-zero">분산≈0</span>`;
  badges += `<span class="badge ${d.type==='categorical'?'badge-cat':'badge-num'}">${d.type==='categorical'?'범주형':'수치형'}</span>`;

  // 통계 행
  let statsHtml = '';
  if(d.type === 'numeric'){
    statsHtml = `<div class="stats">
      <div class="stat"><div class="stat-label">유효</div><div class="stat-value green">${fmt(d.valid)}</div></div>
      <div class="stat"><div class="stat-label">결측</div><div class="stat-value ${missingPct>50?'red':missingPct>5?'blue':'gray'}">${fmt(d.missing)}</div></div>
      <div class="stat"><div class="stat-label">min</div><div class="stat-value blue">${d.min}</div></div>
      <div class="stat"><div class="stat-label">max</div><div class="stat-value blue">${d.max}</div></div>
      <div class="stat"><div class="stat-label">중앙값</div><div class="stat-value gray">${d.median}</div></div>
    </div>`;
  } else {
    const total_valid = d.valid;
    statsHtml = `<div class="stats">
      <div class="stat"><div class="stat-label">유효</div><div class="stat-value green">${fmt(d.valid)}</div></div>
      <div class="stat"><div class="stat-label">결측</div><div class="stat-value ${missingPct>5?'red':'gray'}">${fmt(d.missing)}</div></div>
      <div class="stat"><div class="stat-label">카테고리</div><div class="stat-value blue">${Object.keys(d.values).length}개</div></div>
    </div>`;
  }

  // 결측치 바
  const mColor = missingColor(missingPct);
  const missingHtml = `<div class="missing-row">
    <span class="missing-label">결측</span>
    <div class="missing-track"><div class="missing-fill" style="width:${missingPct}%;background:${mColor}"></div></div>
    <span class="missing-pct" style="color:${mColor}">${missingPct.toFixed(1)}%</span>
  </div>`;

  // 차트
  let chartHtml = '';
  if(d.type === 'categorical'){
    const entries = Object.entries(d.values).filter(([k])=>k!=='nan').slice(0,8);
    const maxV = Math.max(...entries.map(([,v])=>v));
    const bars = entries.map(([k,v])=>{
      const w = maxV > 0 ? (v/maxV*100).toFixed(1) : 0;
      return `<div class="bar-row">
        <span class="bar-key" title="${k}">${k}</span>
        <div class="bar-track"><div class="bar-fill-cat" style="width:${w}%"></div></div>
        <span class="bar-val">${fmtFull(v)}</span>
      </div>`;
    }).join('');
    chartHtml = `<div class="chart-area"><div class="chart-title">값 분포</div><div class="bar-chart">${bars}</div></div>`;
  } else if(d.hist_counts && d.hist_counts.length > 1){
    const maxC = Math.max(...d.hist_counts);
    const bars = d.hist_counts.map((c,i)=>{
      const h = maxC > 0 ? Math.max(2, (c/maxC*100)) : 2;
      return `<div class="hist-bar" style="height:${h}%" title="${d.hist_labels[i]||i}: ${fmtFull(c)}"></div>`;
    }).join('');
    const first = d.hist_labels[0]||'';
    const last = d.hist_labels[d.hist_labels.length-1]||'';
    chartHtml = `<div class="chart-area">
      <div class="chart-title">히스토그램 (평균: ${d.mean})</div>
      <div class="hist-wrap">${bars}</div>
      <div class="hist-axis"><span>${first}</span><span>${last}</span></div>
    </div>`;
  }

  return `<div class="card" data-type="${d.type}" data-drop="${isDrop}" data-zero="${isZero}" data-name="${name}">
    <div class="card-header">
      <div class="col-name">${name}</div>
      <div class="badges">${badges}</div>
    </div>
    ${statsHtml}
    ${missingHtml}
    ${chartHtml}
  </div>`;
}

// 렌더링
const grid = document.getElementById('grid');
const countBadge = document.getElementById('countBadge');
let currentFilter = 'all';
let currentSearch = '';

function render(){
  const cards = Object.entries(DATA).filter(([name, d])=>{
    const matchFilter =
      currentFilter === 'all' ? true :
      currentFilter === 'categorical' ? d.type === 'categorical' :
      currentFilter === 'numeric' ? d.type === 'numeric' :
      currentFilter === 'drop' ? !!d.drop :
      currentFilter === 'zero' ? !!d.zero_var : true;
    const matchSearch = name.toLowerCase().includes(currentSearch.toLowerCase());
    return matchFilter && matchSearch;
  });
  grid.innerHTML = cards.map(([n,d])=>buildCard(n,d)).join('');
  countBadge.textContent = `${cards.length}개 피처`;
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e=>{
  currentSearch = e.target.value;
  render();
});

render();
</script>
